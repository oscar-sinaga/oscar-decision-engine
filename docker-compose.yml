services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oscar
      POSTGRES_PASSWORD: oscar_dev_password
      POSTGRES_DB: oscar
    ports:
      - "5455:5432"
    volumes:
      - oscar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oscar -d oscar"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      OSCAR_DATABASE_URL: postgresql+asyncpg://oscar:oscar_dev_password@postgres:5432/oscar
      OSCAR_ENVIRONMENT: compose
      OSCAR_JWT_SECRET: compose-dev-secret-not-for-production
      OSCAR_CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173","http://localhost:4173","http://127.0.0.1:4173","http://localhost:3000","http://127.0.0.1:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "uv run --no-sync alembic upgrade head &&
             uv run --no-sync python -m app.seed &&
             uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  oscar_pgdata:
