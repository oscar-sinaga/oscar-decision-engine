name: OSCAR review source snapshot

on:
  push:
    branches:
      - fix/security-reliability-hardening-20261104
    paths:
      - .github/workflows/review-source.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source and isolated review tools
        run: |
          set -euo pipefail
          mkdir -p /tmp/oscar-review/wheels
          git archive --format=zip --output=/tmp/oscar-review/source.zip HEAD
          git rev-parse HEAD > /tmp/oscar-review/commit.txt
          python3 -m pip download --only-binary=:all: --no-deps --dest /tmp/oscar-review/wheels ruff==0.15.20 bcrypt==5.0.0 PyJWT==2.15.0
      - uses: actions/upload-artifact@v4
        with:
          name: oscar-review-source
          path: /tmp/oscar-review/
          retention-days: 1
          if-no-files-found: error
