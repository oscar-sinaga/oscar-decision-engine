name: OSCAR reviewed repair validation

on:
  push:
    branches: ["fix/security-reliability-hardening-20261104"]
    paths:
      - ".github/workflows/audit-apply.yml"
      - ".github/audit-repair.*.gzpart"

permissions:
  contents: write

concurrency:
  group: oscar-reviewed-repair
  cancel-in-progress: false

jobs:
  validate-and-publish:
    if: github.repository == 'oscar-sinaga/oscar-decision-engine' && github.ref == 'refs/heads/fix/security-reliability-hardening-20261104'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oscar
          POSTGRES_PASSWORD: oscar_ci_only
          POSTGRES_DB: oscar
        ports: ["5455:5432"]
        options: >-
          --health-cmd "pg_isready -U oscar -d oscar"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OSCAR_DATABASE_URL: postgresql+asyncpg://oscar:oscar_ci_only@127.0.0.1:5455/oscar_test
      OSCAR_ENVIRONMENT: testing
      OSCAR_JWT_SECRET: ci-test-only-secret-not-for-any-deployment
      OSCAR_SEED_PASSWORD: OscarDemo123!
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Apply checksum-pinned reviewed patch
        id: patch
        run: |
          mkdir -p audit-evidence
          python - <<'PY'
          import gzip, hashlib, pathlib, subprocess
          parts = sorted(pathlib.Path('.github').glob('audit-repair.*.gzpart'))
          assert len(parts) == 3
          patch = gzip.decompress(b''.join(p.read_bytes() for p in parts))
          assert hashlib.sha256(patch).hexdigest() == 'c35176760bf51a9e7ddcd4d12c79e97b484ee199b7c07bfcc828e475d5c3a1da'
          for line in patch.decode().splitlines():
              if line.startswith('+++ b/'):
                  assert line[6:].startswith(('backend/', 'frontend/', 'docs/')), line
          pathlib.Path('/tmp/oscar-reviewed.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '/tmp/oscar-reviewed.patch'], check=True)
          subprocess.run(['git', 'apply', '/tmp/oscar-reviewed.patch'], check=True)
          PY
      - name: Resolve compatible dependency security updates
        id: dependencies
        run: |
          cd backend
          uv lock --upgrade-package anyio --upgrade-package certifi --upgrade-package dnspython --upgrade-package pyjwt --upgrade-package urllib3
          uv sync --frozen
          cd ../frontend
          npm ci --ignore-scripts
          set +e
          npm audit fix --ignore-scripts > ../audit-evidence/npm-compatible-fix.txt 2>&1
          status=$?
          set -e
          cat ../audit-evidence/npm-compatible-fix.txt
          echo "$status" > ../audit-evidence/npm-compatible-fix-exit.txt
          npm ci
      - name: Format proposed source and run backend quality gates
        id: backend
        run: |
          cd backend
          uv run ruff check --fix --select I .
          uv run ruff format .
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy app tests | tee ../audit-evidence/mypy.txt
          uv run pytest -q | tee ../audit-evidence/pytest.txt
      - name: Frontend quality gates
        id: frontend
        if: always() && steps.dependencies.outcome == 'success'
        working-directory: frontend
        run: |
          npx prettier --write 'src/routes/manual-review/[id]/+page.svelte' package.json package-lock.json
          npm run lint
          npm run check
          npm run test:unit -- --run | tee ../audit-evidence/vitest.txt
          npm run build
      - name: Repeated browser regression tests on a separate synthetic database
        id: browser
        if: always() && steps.frontend.outcome == 'success' && steps.dependencies.outcome == 'success'
        env:
          OSCAR_DATABASE_URL: postgresql+asyncpg://oscar:oscar_ci_only@127.0.0.1:5455/oscar
        run: |
          cd backend
          uv run alembic upgrade head
          uv run python -m app.seed
          nohup uv run --no-sync uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../audit-evidence/backend-runtime.log 2>&1 &
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then break; fi
            sleep 2
          done
          curl --fail --show-error http://127.0.0.1:8000/health
          cd ../frontend
          npx playwright install --with-deps chromium
          npx playwright test --repeat-each=2 | tee ../audit-evidence/playwright.txt
      - name: Capture dependency findings and candidate source
        if: always() && steps.patch.outcome == 'success'
        run: |
          set +e
          cd frontend
          npm audit --json > ../audit-evidence/npm-audit-all.json
          echo "$?" > ../audit-evidence/npm-audit-all-exit.txt
          npm audit --omit=dev --json > ../audit-evidence/npm-audit-runtime.json
          cd ../backend
          uv export --frozen --no-dev --no-hashes --format requirements-txt > ../audit-evidence/runtime-requirements.txt
          uvx pip-audit -r ../audit-evidence/runtime-requirements.txt --format json --output ../audit-evidence/pip-audit.json
          echo "$?" > ../audit-evidence/pip-audit-exit.txt
          cd ..
          set -e
          git add -N backend frontend docs
          git diff --binary HEAD > audit-evidence/candidate.patch
          git diff --stat HEAD > audit-evidence/change-summary.txt
          git rev-parse HEAD > audit-evidence/base-commit.txt
          python - <<'PY'
          import pathlib, subprocess, zipfile
          files = subprocess.check_output(['git', 'ls-files', '-co', '--exclude-standard', '-z']).decode().split('\0')
          with zipfile.ZipFile('audit-evidence/candidate-source.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for name in sorted(set(files)):
                  if not name or name.startswith(('audit-evidence/', '.github/audit-repair.')):
                      continue
                  p = pathlib.Path(name)
                  if p.is_file():
                      z.write(p, name)
          PY
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oscar-repair-validation-${{ github.sha }}
          path: |
            audit-evidence/
            frontend/test-results/
          if-no-files-found: error
          retention-days: 7
      - name: Publish only fully passing changes to the hardening branch
        if: success() && steps.backend.outcome == 'success' && steps.frontend.outcome == 'success' && steps.browser.outcome == 'success'
        run: |
          target=refs/heads/fix/security-reliability-hardening-20261104
          actual=$(git ls-remote origin "$target" | cut -f1)
          test "$actual" = "$GITHUB_SHA" || { echo 'Branch changed; refusing stale publish'; exit 1; }
          git config user.name 'OSCAR CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend frontend docs
          git rm .github/audit-repair.*.gzpart .github/workflows/audit-apply.yml
          git commit -m 'fix(audit): correct runtime types, governance, concurrent review and dependency security'
          git push origin "HEAD:$target"
